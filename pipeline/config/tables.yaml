# Per-year mapping: dataset -> NCRB raw file + table ID + how to read it.
#
# NCRB renumbers tables between editions, so each year is configured explicitly.
# Only `status: ready` entries are parsed. 2022-2024 are ready: the tables were extracted from the
# NCRB Vol. I PDFs (text layer, pdf.js) into data/raw/ncrb/<year>/extracted/*.csv, one CSV per
# printed table, with page numbers and the PDF's SHA-256 recorded in data/raw/ncrb/<year>/PROVENANCE.md.
# Every extracted table was checked: States+UTs sum exactly to NCRB's All-India row.
#
# Column spec: {col_index: "dimension_value"} or {col_index: {dim, dataset, metric, unit, year, dimension}}
# format: csv | xlsx | pdf | long_csv (one value per row, national crime-head rows)
editions:
  2024:
    title: Crime in India 2024
    released: 2026-05
    url: https://ncrb.gov.in/en/crime-india
    notes: Extracted from NCRB Crime in India 2024, Vol. I (PDF, SHA-256 75b827bdcfcd5e64…, copy retrieved via https://data.opencity.in/dataset/crime-in-india-2024) — see data/raw/ncrb/2024/PROVENANCE.md.
  2023:
    title: Crime in India 2023
    released: 2025-09
    url: https://ncrb.gov.in/en/crime-india
    notes: Extracted from NCRB Crime in India 2023, Vol. I (PDF, SHA-256 553ac8b2eadfe9e2…, copy retrieved via https://data.opencity.in/dataset/crime-in-india-2023) — see data/raw/ncrb/2023/PROVENANCE.md.
  2022:
    title: Crime in India 2022
    released: 2023-12
    url: https://ncrb.gov.in/en/crime-india
    notes: Extracted from NCRB Crime in India 2022, Vol. I (PDF, SHA-256 7c5ee3128b0b6bc7…, copy retrieved via https://data.opencity.in/dataset/crime-in-india-2022) — see data/raw/ncrb/2022/PROVENANCE.md.
  2017:
    title: Crime in India 2017
    released: ''
    url: https://ncrb.gov.in/en/crime-india
  2018:
    title: Crime in India 2018
    released: ''
    url: https://ncrb.gov.in/en/crime-india
  2019:
    title: Crime in India 2019
    released: ''
    url: https://ncrb.gov.in/en/crime-india
  2020:
    title: Crime in India 2020
    released: ''
    url: https://ncrb.gov.in/en/crime-india
  2021:
    title: Crime in India 2021
    released: ''
    url: https://ncrb.gov.in/en/crime-india
